spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/contestdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:contestuser}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  rabbitmq:
    listener:
      simple:
        prefetch: ${JUDGE_QUEUE_PREFETCH:12}
        default-requeue-rejected: false
 
judge:
  auth:
    token: ${JUDGE_INTERNAL_TOKEN}
  docker:
    enabled: true
    pull-on-demand: ${JUDGE_DOCKER_PULL_ON_DEMAND:false}
    warmup:
      enabled: ${JUDGE_DOCKER_WARMUP_ENABLED:true}
      pull-missing: ${JUDGE_DOCKER_WARMUP_PULL_MISSING:true}
      images: ${JUDGE_DOCKER_WARMUP_IMAGES:}
  execution:
    batch-mode-enabled: ${JUDGE_EXECUTION_BATCH_MODE_ENABLED:true}
    batch-for-submit-enabled: ${JUDGE_EXECUTION_BATCH_FOR_SUBMIT_ENABLED:true}
    batch-min-testcases: ${JUDGE_EXECUTION_BATCH_MIN_TESTCASES:2}
    worker-pool-enabled: ${JUDGE_EXECUTION_WORKER_POOL_ENABLED:true}
    worker-pool-initial-size: ${JUDGE_EXECUTION_WORKER_POOL_INITIAL_SIZE:1}
    worker-pool-max-per-language: ${JUDGE_EXECUTION_WORKER_POOL_MAX_PER_LANGUAGE:0}
    wait-thread-pool-size: ${JUDGE_EXECUTION_WAIT_THREAD_POOL_SIZE:32}
    max-active-containers: ${JUDGE_EXECUTION_MAX_ACTIVE_CONTAINERS:16}
    queue-wait-timeout-ms: ${JUDGE_EXECUTION_QUEUE_WAIT_TIMEOUT_MS:2000}
    stop-on-first-failure: ${JUDGE_EXECUTION_STOP_ON_FIRST_FAILURE:true}
    language-limit-java: ${JUDGE_EXECUTION_LANGUAGE_LIMIT_JAVA:6}
    language-limit-python: ${JUDGE_EXECUTION_LANGUAGE_LIMIT_PYTHON:8}
    language-limit-cpp: ${JUDGE_EXECUTION_LANGUAGE_LIMIT_CPP:8}
    language-limit-node: ${JUDGE_EXECUTION_LANGUAGE_LIMIT_NODE:4}
  queue:
    listener-concurrency: ${JUDGE_QUEUE_LISTENER_CONCURRENCY:2-6}
    submit-listener-concurrency: ${JUDGE_QUEUE_SUBMIT_LISTENER_CONCURRENCY:${JUDGE_QUEUE_LISTENER_CONCURRENCY:2-6}}
    run-listener-concurrency: ${JUDGE_QUEUE_RUN_LISTENER_CONCURRENCY:2-4}
    high-listener-concurrency: ${JUDGE_QUEUE_HIGH_LISTENER_CONCURRENCY:2-8}
    retry-delay-ms: ${JUDGE_QUEUE_RETRY_DELAY_MS:5000}
    max-retries: ${JUDGE_QUEUE_MAX_RETRIES:4}
  shutdown:
    drain-timeout-seconds: ${JUDGE_SHUTDOWN_DRAIN_TIMEOUT_SECONDS:25}
    drain-poll-ms: ${JUDGE_SHUTDOWN_DRAIN_POLL_MS:200}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

server:
  port: ${SERVER_PORT:5000}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.web.socket.config.WebSocketMessageBrokerStats: WARN
