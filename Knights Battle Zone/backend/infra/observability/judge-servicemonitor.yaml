apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: contest-judge-sm
  namespace: production
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: contest-judge
  namespaceSelector:
    matchNames:
      - production
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s

