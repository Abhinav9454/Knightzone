apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: contest-backend-sm
  namespace: production
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: contest-backend
  namespaceSelector:
    matchNames:
      - production
  endpoints:
    - port: http
      path: /api/actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s

