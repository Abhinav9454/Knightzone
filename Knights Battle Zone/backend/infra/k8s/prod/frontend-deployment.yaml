apiVersion: apps/v1
kind: Deployment
metadata:
  name: contest-frontend
  labels:
    app: contest-frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: contest-frontend
  template:
    metadata:
      labels:
        app: contest-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/knights-battle-zone/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: VITE_API_BASE_URL
              value: /api
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "800m"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]


