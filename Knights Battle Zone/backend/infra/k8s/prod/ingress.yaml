apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knights-battle-zone-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - app.unifiedcode.example
      secretName: knights-battle-zone-tls
  rules:
    - host: app.unifiedcode.example
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: contest-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: contest-frontend
                port:
                  number: 3000


