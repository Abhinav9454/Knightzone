apiVersion: v1
kind: Secret
metadata:
  name: knights-battle-zone-secrets
  annotations:
    notes: "Fallback template only. Prefer External Secrets / Vault in production."
type: Opaque
stringData:
  JWT_SECRET: "replace-with-64-plus-char-random-secret"
  TRACKER_TOKEN_SECRET: "replace-with-64-plus-char-random-secret"
  JUDGE_INTERNAL_TOKEN: "replace-with-64-plus-char-random-secret"
  DB_URL: "jdbc:mysql://mysql-primary.production.svc.cluster.local:3306/contestdb?useSSL=true&requireSSL=true&serverTimezone=UTC"
  DB_USER: "contestuser"
  DB_PASSWORD: "replace-with-strong-db-password"
  DB_READ_REPLICA_URL: "jdbc:mysql://mysql-replica.production.svc.cluster.local:3306/contestdb?useSSL=true&requireSSL=true&serverTimezone=UTC"
  DB_READ_REPLICA_USER: "contestuser_ro"
  DB_READ_REPLICA_PASSWORD: "replace-with-strong-read-db-password"
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-primary.production.svc.cluster.local:3306/contestdb?useSSL=true&requireSSL=true&serverTimezone=UTC"
  SPRING_DATASOURCE_USERNAME: "contestuser"
  SPRING_DATASOURCE_PASSWORD: "replace-with-strong-db-password"
  REDIS_PASSWORD: "replace-with-strong-redis-password"
  SPRING_RABBITMQ_USERNAME: "contest-rabbit-user"
  SPRING_RABBITMQ_PASSWORD: "replace-with-strong-rabbit-password"
  KEDA_RABBITMQ_HOST: "amqp://contest-rabbit-user:replace-with-strong-rabbit-password@rabbitmq.production.svc.cluster.local:5672/"
  WS_BROKER_CLIENT_LOGIN: "contest-rabbit-user"
  WS_BROKER_CLIENT_PASSCODE: "replace-with-strong-rabbit-password"
  WS_BROKER_SYSTEM_LOGIN: "contest-rabbit-user"
  WS_BROKER_SYSTEM_PASSCODE: "replace-with-strong-rabbit-password"

