apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: knights-battle-zone-secrets
  namespace: production
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: knights-battle-zone-secret-store
  target:
    name: knights-battle-zone-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: knights-battle-zone/prod/jwt
        property: value
    - secretKey: TRACKER_TOKEN_SECRET
      remoteRef:
        key: knights-battle-zone/prod/tracker-token
        property: value
    - secretKey: JUDGE_INTERNAL_TOKEN
      remoteRef:
        key: knights-battle-zone/prod/judge-token
        property: value
    - secretKey: DB_URL
      remoteRef:
        key: knights-battle-zone/prod/db
        property: url
    - secretKey: DB_USER
      remoteRef:
        key: knights-battle-zone/prod/db
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: knights-battle-zone/prod/db
        property: password
    - secretKey: DB_READ_REPLICA_URL
      remoteRef:
        key: knights-battle-zone/prod/db-read-replica
        property: url
    - secretKey: DB_READ_REPLICA_USER
      remoteRef:
        key: knights-battle-zone/prod/db-read-replica
        property: username
    - secretKey: DB_READ_REPLICA_PASSWORD
      remoteRef:
        key: knights-battle-zone/prod/db-read-replica
        property: password
    - secretKey: SPRING_DATASOURCE_URL
      remoteRef:
        key: knights-battle-zone/prod/db
        property: url
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: knights-battle-zone/prod/db
        property: username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: knights-battle-zone/prod/db
        property: password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: knights-battle-zone/prod/redis
        property: password
    - secretKey: SPRING_RABBITMQ_USERNAME
      remoteRef:
        key: knights-battle-zone/prod/rabbitmq
        property: username
    - secretKey: SPRING_RABBITMQ_PASSWORD
      remoteRef:
        key: knights-battle-zone/prod/rabbitmq
        property: password
    - secretKey: KEDA_RABBITMQ_HOST
      remoteRef:
        key: knights-battle-zone/prod/rabbitmq
        property: amqpUri
    - secretKey: WS_BROKER_CLIENT_LOGIN
      remoteRef:
        key: knights-battle-zone/prod/rabbitmq
        property: username
    - secretKey: WS_BROKER_CLIENT_PASSCODE
      remoteRef:
        key: knights-battle-zone/prod/rabbitmq
        property: password
    - secretKey: WS_BROKER_SYSTEM_LOGIN
      remoteRef:
        key: knights-battle-zone/prod/rabbitmq
        property: username
    - secretKey: WS_BROKER_SYSTEM_PASSCODE
      remoteRef:
        key: knights-battle-zone/prod/rabbitmq
        property: password

