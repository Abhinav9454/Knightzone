apiVersion: apps/v1
kind: Deployment
metadata:
  name: contest-backend
  labels:
    app: contest-backend
spec:
  replicas: 6
  selector:
    matchLabels:
      app: contest-backend
  template:
    metadata:
      labels:
        app: contest-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/knights-battle-zone/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: knights-battle-zone-config
            - secretRef:
                name: knights-battle-zone-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "1500m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 30


