name: Backend CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - 'backend/scripts/run-integration-tests.*'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - 'backend/scripts/run-integration-tests.*'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend unit tests
        working-directory: backend
        run: mvn -B "-Dtest=*Test,!*IntegrationTest" test

  integration-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit-tests
    strategy:
      fail-fast: true
      matrix:
        suite: [smoke, core, clubs, marketplace, placement, stream, security]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ensure script executable
        run: chmod +x backend/scripts/run-integration-tests.sh

      - name: Run integration suite (${{ matrix.suite }})
        run: ./backend/scripts/run-integration-tests.sh ${{ matrix.suite }}

      - name: Assert integration tests were not skipped
        run: |
          shopt -s nullglob
          files=(backend/target/surefire-reports/TEST-*.xml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No surefire reports found."
            exit 1
          fi
          skipped_total=$(grep -Rho 'skipped="[0-9]\+"' backend/target/surefire-reports/TEST-*.xml | sed -E 's/[^0-9]//g' | awk '{s+=$1} END {print s+0}')
          echo "Skipped tests: ${skipped_total}"
          if [ "${skipped_total}" -gt 0 ]; then
            echo "Integration suite contains skipped tests."
            exit 1
          fi

      - name: Upload surefire reports (${{ matrix.suite }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-${{ matrix.suite }}
          path: backend/target/surefire-reports/**
