name: Judge CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/judge-service/**'
      - '.github/workflows/judge-ci.yml'
      - 'docker-compose.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/judge-service/**'
      - '.github/workflows/judge-ci.yml'
      - 'docker-compose.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven compile
        working-directory: backend/judge-service
        run: mvn -B -DskipTests compile

      - name: Maven package
        working-directory: backend/judge-service
        run: mvn -B -DskipTests package

      - name: Upload judge artifact
        uses: actions/upload-artifact@v4
        with:
          name: judge-service-jar
          path: backend/judge-service/target/judge-service-*.jar

  image:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build judge Docker image (no push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: docker/build-push-action@v5
        with:
          context: ./backend/judge-service
          file: ./backend/judge-service/Dockerfile
          push: false
          tags: user/contest-judge:latest
