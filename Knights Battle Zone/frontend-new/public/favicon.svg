<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="10" y1="4" x2="54" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="64" height="64" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Knight Shield -->
  <path
    d="M32 4L54 13.5V33.5C54 45.8 44.5 56.2 32 59.5C19.5 56.2 10 45.8 10 33.5V13.5L32 4Z"
    fill="url(#shieldGrad)"
    stroke="url(#edgeGrad)"
    stroke-width="3"
    stroke-linejoin="round"
    filter="url(#shadow)"
  />

  <!-- Inner Crest Contour -->
  <path
    d="M32 9L49 16.5V32.5C49 42.5 41.5 51 32 54C22.5 51 15 42.5 15 32.5V16.5L32 9Z"
    fill="#090d16"
  />

  <!-- Left Crossed Sword Blade -->
  <path
    d="M20 18L32 30L30 32L18 20L15 22L17 16L23 18L20 18Z"
    fill="url(#bladeGrad)"
    stroke="#090d16"
    stroke-width="0.8"
  />
  <!-- Right Crossed Sword Blade -->
  <path
    d="M44 18L32 30L34 32L46 20L49 22L47 16L41 18L44 18Z"
    fill="url(#bladeGrad)"
    stroke="#090d16"
    stroke-width="0.8"
  />

  <!-- Knight Helm Visor Plate -->
  <path
    d="M25 25H39L42 32.5H22L25 25Z"
    fill="#ffffff"
    stroke="#090d16"
    stroke-width="0.8"
  />
  <!-- Visor Horizontal Sight Slits -->
  <line x1="27" y1="28.5" x2="37" y2="28.5" stroke="#090d16" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="28.5" y1="31" x2="35.5" y2="31" stroke="#090d16" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Knight Valor Diamond / Core Gem -->
  <polygon
    points="32,36 37,42.5 32,49 27,42.5"
    fill="#ffffff"
    stroke="#090d16"
    stroke-width="0.8"
  />
  <circle cx="32" cy="42.5" r="1.6" fill="#090d16"/>
</svg>